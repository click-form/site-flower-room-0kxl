<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Забронювати букет — Flower Room Мукачево</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .lang-ru, .lang-en { display: none; }
    html[lang="ru"] .lang-uk, html[lang="ru"] .lang-en { display: none; }
    html[lang="ru"] .lang-ru { display: block; }
    html[lang="en"] .lang-uk, html[lang="en"] .lang-ru { display: none; }
    html[lang="en"] .lang-en { display: block; }
  </style>
</head>
<body class="bg-[#F5F5F5] text-[#2C2C2C]">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md h-20 border-b border-gray-100 flex items-center justify-between px-6 md:px-12">
    <a href="index.html" class="text-2xl font-bold tracking-wider text-black">Flower Room</a>
    <nav class="hidden md:flex items-center space-x-8 font-medium">
      <a href="index.html" class="hover:text-[#D4AF37] transition" data-i18n="nav_home">Головна</a>
      <a href="about.html" class="hover:text-[#D4AF37] transition" data-i18n="nav_about">Про нас</a>
      <a href="services.html" class="hover:text-[#D4AF37] transition" data-i18n="nav_menu">Меню</a>
      <a href="gallery.html" class="hover:text-[#D4AF37] transition" data-i18n="nav_gallery">Галерея</a>
      <a href="booking.html" class="text-[#D4AF37]" data-i18n="nav_booking">Забронювати</a>
      <a href="contacts.html" class="hover:text-[#D4AF37] transition" data-i18n="nav_contacts">Контакти</a>
    </nav>
    <div class="flex items-center space-x-4">
      <div class="flex space-x-1 text-xs font-semibold">
        <button onclick="setLang('uk')" class="px-2 py-1 rounded bg-[#2C2C2C] text-white">UA</button>
        <button onclick="setLang('ru')" class="px-2 py-1 rounded bg-gray-200 text-gray-800">RU</button>
        <button onclick="setLang('en')" class="px-2 py-1 rounded bg-gray-200 text-gray-800">EN</button>
      </div>
      <a href="booking.html" class="hidden sm:inline-block bg-[#D4AF37] text-white px-5 py-2.5 rounded-xl font-medium shadow-lg hover:bg-black transition" data-i18n="btn_book">Забронювати</a>
    </div>
  </header>

  <!-- Booking Form Section -->
  <main class="py-20 px-6">
    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl p-10 border border-gray-100">
      <h1 class="text-3xl md:text-4xl font-bold mb-8 text-center">
        <span class="lang-uk">Забронювати букет</span>
        <span class="lang-ru">Забронировать букет</span>
        <span class="lang-en">Book a Bouquet</span>
      </h1>

      <form action="https://formsubmit.co/hello@example.com" method="POST" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold mb-2">
            <span class="lang-uk">Ваше ім'я</span>
            <span class="lang-ru">Ваше имя</span>
            <span class="lang-en">Your Name</span>
          </label>
          <input type="text" name="name" required class="w-full px-5 py-4 border-2 border-gray-200 rounded-xl focus:border-[#D4AF37] outline-none transition">
        </div>

        <div>
          <label class="block text-sm font-semibold mb-2">
            <span class="lang-uk">Номер телефону</span>
            <span class="lang-ru">Номер телефона</span>
            <span class="lang-en">Phone Number</span>
          </label>
          <input type="tel" name="phone" required class="w-full px-5 py-4 border-2 border-gray-200 rounded-xl focus:border-[#D4AF37] outline-none transition">
        </div>

        <div>
          <label class="block text-sm font-semibold mb-2">
            <span class="lang-uk">Повідомлення або побажання до букету</span>
            <span class="lang-ru">Сообщение или пожелания к букету</span>
            <span class="lang-en">Message or bouquet preferences</span>
          </label>
          <textarea name="message" rows="4" class="w-full px-5 py-4 border-2 border-gray-200 rounded-xl focus:border-[#D4AF37] outline-none transition"></textarea>
        </div>

        <button type="submit" class="w-full bg-[#D4AF37] text-white py-4 rounded-xl font-semibold shadow-lg hover:bg-black transition text-lg">
          <span class="lang-uk">Підтвердити замовлення</span>
          <span class="lang-ru">Подтвердить заказ</span>
          <span class="lang-en">Confirm Order</span>
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-black text-gray-400 py-12 px-6">
    <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-8">
      <div>
        <h3 class="text-white text-xl font-bold mb-4">Flower Room</h3>
        <p class="text-sm">вулиця Богуна Івана, 24а, Мукачево, Україна, 89600</p>
      </div>
      <div>
        <h4 class="text-white font-semibold mb-4">Контакти</h4>
        <p class="text-sm">Телефон: +380959147639</p>
      </div>
      <div>
        <h4 class="text-white font-semibold mb-4">Години роботи</h4>
        <p class="text-sm">Щодня: 8:00 - 20:00</p>
      </div>
    </div>
  </footer>

  <script>
    const i18n = {
      uk: { "nav_home": "Головна", "nav_about": "Про нас", "nav_menu": "Меню", "nav_gallery": "Галерея", "nav_booking": "Забронювати", "nav_contacts": "Контакти", "btn_call": "Зателефонувати", "btn_book": "Забронювати", "hero_btn": "Переглянути меню" },
      ru: { "nav_home": "Главная", "nav_about": "О нас", "nav_menu": "Меню", "nav_gallery": "Галерея", "nav_booking": "Забронировать", "nav_contacts": "Контакты", "btn_call": "Позвонить", "btn_book": "Забронировать", "hero_btn": "Посмотреть меню" },
      en: { "nav_home": "Home", "nav_about": "About", "nav_menu": "Menu", "nav_gallery": "Gallery", "nav_booking": "Book", "nav_contacts": "Contacts", "btn_call": "Call Us", "btn_book": "Book Now", "hero_btn": "View Menu" }
    };
    function setLang(lang) {
      localStorage.setItem('site_lang', lang);
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang] && i18n[lang][key]) el.innerText = i18n[lang][key];
      });
    }
    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('site_lang') || 'uk';
      setLang(savedLang);
    });
  </script>
</body>
</html>
